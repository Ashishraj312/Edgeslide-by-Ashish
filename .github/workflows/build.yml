name: Build EdgeSlide

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14   # Apple Silicon runner
    steps:
      - uses: actions/checkout@v4
      - name: Build app
        run: bash build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: EdgeSlide
          path: build/EdgeSlide.zip
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: build/EdgeSlide.zip
